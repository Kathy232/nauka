--
- name: Install prometheus node-exporter 1.6.0 
  hosts: kasia
  become: true

  tasks:

    - name: Install packages
      apt:
        name:
        - wget
        - tar
        state: present

    - name: Create user
      ansible.builtin.user:
        name: node_exporter
        state: present
        system: true
        shell: /bin/false
        home: /nonexistent

    - name: Download package & tar 
      command: |
        bash -c '
          wget https://github.com/prometheus/node_exporter/releases/download/v1.6.0/node_exporter-1.6.0.linux-arm64.tar.gz &&
          tar xvfz node_exporter-1.6.0.linux-arm64.tar.gz &&
          rm -rf node_exporter-1.6.0.linux-arm64.tar.gz &&
          cd node_exporter-1.6.0.linux-arm64 &&
          cp node_exporter /usr/local/bin/ &&
          chown node_exporter:node_exporter /usr/local/bin/node_exporter
        '
    - name: Copy service file
      copy:
        src: node_exporter.service
        dest: /etc/systemd/system/node_exporter.service

    - name: Reload daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Start node_exporter service
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: yes

    - name: Restart node_exporter service
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        enabled: yes
